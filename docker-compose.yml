services:
  db:
    image: postgres:16
    container_name: crop_recommendation_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

